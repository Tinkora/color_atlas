[workspace]
members = ["crates/color_atlas_core", "crates/color_atlas_web"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
description = "Browser-local color conversion, palette, contrast, and harmony toolkit"
license = "MIT"
repository = "https://github.com/Tinkora/color_atlas"
rust-version = "1.95"

[workspace.dependencies]
color_atlas_core = { version = "=0.1.0-alpha.1", path = "crates/color_atlas_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

[profile.release]
lto = "thin"
strip = true
